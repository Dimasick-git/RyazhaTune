name: Update README Version

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Get latest release version
        id: get_version
        run: |
          VERSION=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r .tag_name)
          # Remove 'v' prefix if present
          VERSION_CLEAN=${VERSION#v}
          echo "VERSION=$VERSION_CLEAN" >> $GITHUB_OUTPUT

      - name: Update README.md
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          sed -i "s/- \*\*Текущая версия:\*\* .*/- **Текущая версия:** $VERSION/" README.md

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: update current version in README to ${{ steps.get_version.outputs.VERSION }}" && git push origin main)
          
