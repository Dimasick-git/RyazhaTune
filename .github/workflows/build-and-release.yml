name: "Автоматическая сборка и релиз RyazhTune"

on:
  push:
    branches:
      - main
    paths:
      - 'Makefile'
      - 'src/**'
      - 'include/**'
      - 'overlay/**'
      - '.github/workflows/build-and-release.yml'

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.CHANGED }}
      new_version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Настройка безопасного Git каталога
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Извлечение текущей версии из Makefile
        id: version
        run: |
          VERSION=$(grep "export VERSION" Makefile | sed 's/.*:= *//' | xargs)
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Проверка изменения версии
        id: check
        run: |
          CURRENT_VERSION='${{ steps.version.outputs.VERSION }}'
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          LATEST_VERSION=${LATEST_TAG#v}
          
          if [[ "$CURRENT_VERSION" != "$LATEST_VERSION" ]]; then
            echo "CHANGED=true" >> "$GITHUB_OUTPUT"
          else
            echo "CHANGED=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Установка зависимостей (jq)
        run: apt-get update && apt-get install -y jq curl git

      - name: Получение исходного кода
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Настройка безопасного Git каталога
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Проверка языковых файлов
        run: |
          if [ -d "overlay/lang" ]; then
            echo "Языковые файлы найдены."
          else
            echo "Ошибка: Директория overlay/lang не найдена!"
            exit 1
          fi

      - name: Подготовка библиотек
        run: make prepare-overlay-lib

      - name: Сборка проекта
        run: make clean && make -j$(nproc)

      - name: Проверка целостности сборки
        run: |
          if [ -f "RyazhTune/RyazhTune.nsp" ] && [ -f "overlay/RyazhTune-Overlay.ovl" ]; then
            echo "Сборка успешно завершена."
          else
            echo "Ошибка: Файлы сборки не найдены!"
            ls -R
            exit 1
          fi

      - name: Подготовка архива RyazhTune.zip
        run: |
          mkdir -p release/atmosphere/contents/420000000000000E/flags
          mkdir -p release/config/RyazhTune
          mkdir -p release/config/ryazhahand
          mkdir -p release/switch/.overlays
          
          # 1. Атмосфера (модуль)
          touch release/atmosphere/contents/420000000000000E/flags/boot2.flag
          cp RyazhTune/RyazhTune.nsp release/atmosphere/contents/420000000000000E/exefs.nsp
          cp RyazhTune/toolbox.json release/atmosphere/contents/420000000000000E/
          
          # 2. Конфиги и языки
          if [ -d "overlay/lang" ]; then
            cp -r overlay/lang release/config/RyazhTune/
          fi
          cp .github/default-config.ini release/config/RyazhTune/config.ini
          cp .github/default-config.ini release/config/ryazhahand/config.ini
          
          # 3. Оверлей
          cp overlay/RyazhTune-Overlay.ovl release/switch/.overlays/
          
          # Упаковка
          cd release && zip -r ../RyazhTune.zip . && cd ..

      - name: Формирование текста релиза (AI + structured fallback)
        id: changelog
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [[ -n "$LATEST_TAG" ]]; then
            RANGE="${LATEST_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi
          
          RAW_LOG=$(git log "$RANGE" --no-merges --pretty=format:"%s" | grep -Evi "^merge|update workflow|fix yaml" | head -n 40)

          if [[ -n "${OPENROUTER_API_KEY}" && -n "$RAW_LOG" ]]; then
            PROMPT="Ты — release-manager проекта RyazhTune. Напиши релиз-ноты на русском языке в markdown.
            Формат и правила:
            1) Короткое вступление (1-2 предложения).
            2) Разделы по порядку (добавляй только релевантные):
               - ## Новое
               - ## Улучшения
               - ## Исправления
               - ## Совместимость и миграция
            3) Только значимые изменения для пользователей.
            4) Не копируй коммиты дословно, обобщай по смыслу.
            5) Не упоминай ИИ/автогенерацию.
            6) Объём: 120-260 слов.

            Сырые сообщения коммитов (только как контекст):
            $RAW_LOG"

            PAYLOAD=$(jq -n \
              --arg model "openrouter/auto" \
              --arg prompt "$PROMPT" \
              '{
                model: $model,
                messages: [
                  {role: "system", content: "Пиши только по-русски, структурно и по делу."},
                  {role: "user", content: $prompt}
                ],
                temperature: 0.5
              }')

            RESPONSE=$(curl -sS https://openrouter.ai/api/v1/chat/completions \
              -H "Authorization: Bearer ${OPENROUTER_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
            
            AI_BODY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')
          fi

          if [[ -n "$RAW_LOG" ]]; then
            CHANGELOG_SECTIONS=$(echo "$RAW_LOG" | awk '
              BEGIN{new="";impr="";fix=""}
              {l=tolower($0)}
              l ~ /(add|feature|нов|support|lang)/ {new=new "- " $0 "\n"; next}
              l ~ /(fix|bug|crash|error|исправ|почин)/ {fix=fix "- " $0 "\n"; next}
              {impr=impr "- " $0 "\n"}
              END{
                if(new!="") printf "## Новое\n%s\n", new;
                if(impr!="") printf "## Улучшения\n%s\n", impr;
                if(fix!="") printf "## Исправления\n%s\n", fix;
              }')
          else
            CHANGELOG_SECTIONS="- Существенных пользовательских изменений в этом теге не обнаружено."
          fi

          if [[ -n "${AI_BODY}" && "${AI_BODY}" != "null" ]]; then
            {
              echo "RELEASE_BODY<<EOF"
              echo "$AI_BODY"
              echo "EOF"
            } >> "$GITHUB_ENV"
          else
            {
              echo "RELEASE_BODY<<EOF"
              echo "👋 Привет! Готово новое обновление RyazhTune."
              echo
              echo "$CHANGELOG_SECTIONS"
              echo
              echo "## Технические детали"
              echo "- Релиз собран и упакован автоматически."
              echo "- Описание собрано из фактических изменений кода за диапазон релиза."
              echo
              echo "Спасибо за использование RyazhTune! 🎧"
              echo "EOF"
            } >> "$GITHUB_ENV"
          fi

      - name: Создание тега и релиза
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.new_version }}
          name: RyazhTune v${{ needs.check-version.outputs.new_version }}
          files: |
            RyazhTune.zip
            overlay/RyazhTune-Overlay.ovl
          body: |
            ${{ env.RELEASE_BODY }}

            ---
            _Сформировано автоматически на основе реальных изменений в коде._
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
