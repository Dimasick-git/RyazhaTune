name: Автоматическая сборка и релиз RyazhTune

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ryazhatune-release-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check-version:
    name: Проверка версии
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.get_version.outputs.VERSION }}
      version_changed: ${{ steps.check_change.outputs.CHANGED }}
    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Настройка безопасного Git каталога
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Извлечение текущей версии из Makefile
        id: get_version
        run: |
          VERSION=$(awk -F ':=' '/^export VERSION/ { gsub(/[[:space:]]/, "", $2); print $2; exit }' Makefile)
          if [[ -z "$VERSION" ]]; then
            echo "Не удалось извлечь VERSION из Makefile" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Текущая версия в Makefile: $VERSION"

      - name: Проверка изменения версии
        id: check_change
        run: |
          CURRENT_VERSION='${{ steps.get_version.outputs.VERSION }}'
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          LATEST_VERSION=${LATEST_TAG#v}

          if [[ "$CURRENT_VERSION" != "$LATEST_VERSION" ]]; then
            echo "CHANGED=true" >> "$GITHUB_OUTPUT"
          else
            echo "CHANGED=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    name: Сборка и публикация
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Установка зависимостей (jq)
        run: |
          apt-get update && apt-get install -y jq zip curl

      - name: Получение исходного кода
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Настройка безопасного Git каталога
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Проверка языковых файлов
        run: python3 scripts/validate_overlay_lang.py

      - name: Сборка проекта
        run: make -j$(nproc)

      - name: Проверка целостности сборки
        run: |
          test -f RyazhTune/RyazhTune.nsp || { echo "Ошибка: RyazhTune.nsp не найден" >&2; exit 1; }
          test -f overlay/RyazhTune-Overlay.ovl || { echo "Ошибка: RyazhTune-Overlay.ovl не найден" >&2; exit 1; }
          test -f overlay/lang/ru.json || { echo "Ошибка: ru.json не найден" >&2; exit 1; }
          test -f overlay/lang/en.json || { echo "Ошибка: en.json не найден" >&2; exit 1; }
          test -f overlay/lang/zh.json || { echo "Ошибка: zh.json не найден" >&2; exit 1; }

      - name: Подготовка архива RyazhTune.zip
        run: |
          rm -rf release RyazhTune.zip
          mkdir -p release/atmosphere/contents/420000000000000E/flags
          touch release/atmosphere/contents/420000000000000E/flags/boot2.flag
          cp RyazhTune/RyazhTune.nsp release/atmosphere/contents/420000000000000E/exefs.nsp
          cp RyazhTune/RyazhTune.json release/atmosphere/contents/420000000000000E/
          cp RyazhTune/toolbox.json release/atmosphere/contents/420000000000000E/

          mkdir -p release/switch/.overlays
          cp overlay/RyazhTune-Overlay.ovl release/switch/.overlays/

          mkdir -p release/config/RyazhTune/lang
          cp overlay/lang/*.json release/config/RyazhTune/lang/

          (cd release && zip -r ../RyazhTune.zip atmosphere switch config)

      - name: Формирование текста релиза через AI (OpenRouter)
        id: changelog
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          RANGE="HEAD"
          [[ -n "$LATEST_TAG" ]] && RANGE="${LATEST_TAG}..HEAD"
          LOG=$(git log "$RANGE" --pretty=format:"- %s (%h)")
          
          echo "История коммитов для анализа:"
          echo "$LOG"

          if [[ -n "${OPENROUTER_API_KEY}" ]]; then
            echo "OPENROUTER_API_KEY обнаружен, отправка запроса..."
            
            # "Человечный" промпт
            PROMPT="Ты — автор проекта RyazhaTune (мод для Nintendo Switch). Напиши пост о новом релизе для пользователей. 
            Пиши живым, дружелюбным языком, как человек, а не робот. 
            Используй умеренно подходящие эмодзи. 
            Структура:
            1. Приветствие и краткая суть обновления.
            2. Список того, что реально изменилось (основывайся на коммитах ниже).
            3. Если есть исправления — упомяни их.
            4. Пожелай приятного пользования.
            
            Важно: Не выдумывай функции, которых нет в коммитах. Если коммитов мало или они технические, просто опиши их доступно.
            
            Список коммитов:
            $LOG"
            
            # Используем google/gemma-4-31b:free как более новую и доступную
            PAYLOAD=$(jq -n \
              --arg model "google/gemma-4-31b:free" \
              --arg prompt "$PROMPT" \
              '{
                model: $model,
                messages: [
                  {role: "system", content: "Ты — разработчик homebrew для Nintendo Switch. Пишешь на русском языке, дружелюбно и понятно."},
                  {role: "user", content: $prompt}
                ]
              }')

            RESPONSE=$(curl -sS https://openrouter.ai/api/v1/chat/completions \
              -H "Authorization: Bearer ${OPENROUTER_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
            
            AI_BODY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')
            
            if [[ -z "$AI_BODY" || "$AI_BODY" == "null" ]]; then
              echo "Ошибка: AI вернул пустой ответ. Пробуем резервную модель..."
              PAYLOAD=$(echo "$PAYLOAD" | jq '.model = "meta-llama/llama-3.3-70b-instruct:free"')
              RESPONSE=$(curl -sS https://openrouter.ai/api/v1/chat/completions \
                -H "Authorization: Bearer ${OPENROUTER_API_KEY}" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD")
              AI_BODY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')
            fi
          else
            echo "ПРЕДУПРЕЖДЕНИЕ: OPENROUTER_API_KEY не найден."
          fi

          if [[ -n "${AI_BODY}" && "${AI_BODY}" != "null" ]]; then
            {
              echo "RELEASE_BODY<<EOF"
              echo "$AI_BODY"
              echo "EOF"
            } >> "$GITHUB_ENV"
          else
            echo "Использование стандартного шаблона..."
            FEATURES=$(printf "%s\n" "$LOG" | grep -Ei "add|feat|new|реализ|добав" || true)
            FIXES=$(printf "%s\n" "$LOG" | grep -Ei "fix|bug|исправ|устран" || true)

            {
              echo "RELEASE_BODY<<EOF"
              echo "👋 Привет! Вышло новое обновление RyazhTune."
              echo
              echo "Что нового:"
              if [[ -n "$FEATURES" ]]; then
                echo "$FEATURES"
              else
                echo "- Внутренние улучшения и оптимизация кода."
              fi
              echo
              echo "Исправления:"
              if [[ -n "$FIXES" ]]; then
                echo "$FIXES"
              else
                echo "- Повышена стабильность работы модуля."
              fi
              echo
              echo "Спасибо, что пользуетесь RyazhTune! 🎧"
              echo "EOF"
            } >> "$GITHUB_ENV"
          fi

      - name: Создание тега и релиза
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.new_version }}
          name: RyazhTune v${{ needs.check-version.outputs.new_version }}
          files: |
            RyazhTune.zip
            overlay/RyazhTune-Overlay.ovl
          body: |
            ${{ env.RELEASE_BODY }}

            ---
            _Сгенерировано автоматически на основе истории изменений._
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
