name: Автоматическая сборка и релиз RyazhTune

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ryazhatune-release-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check-version:
    name: Проверка версии
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.get_version.outputs.VERSION }}
      version_changed: ${{ steps.check_change.outputs.CHANGED }}
    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Настройка безопасного Git каталога
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Извлечение текущей версии из Makefile
        id: get_version
        run: |
          VERSION=$(awk -F ':=' '/^export VERSION/ { gsub(/[[:space:]]/, "", $2); print $2; exit }' Makefile)
          if [[ -z "$VERSION" ]]; then
            echo "Не удалось извлечь VERSION из Makefile" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Текущая версия в Makefile: $VERSION"

      - name: Проверка изменения версии
        id: check_change
        run: |
          CURRENT_VERSION='${{ steps.get_version.outputs.VERSION }}'
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          LATEST_VERSION=${LATEST_TAG#v}

          if [[ "$CURRENT_VERSION" != "$LATEST_VERSION" ]]; then
            echo "CHANGED=true" >> "$GITHUB_OUTPUT"
          else
            echo "CHANGED=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    name: Сборка и публикация
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Настройка безопасного Git каталога
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Сборка проекта
        run: |
          python3 - <<'PY'
          import json
          import pathlib

          lang_dir = pathlib.Path('overlay/lang')
          languages = {path.stem: json.loads(path.read_text(encoding='utf-8')) for path in sorted(lang_dir.glob('*.json'))}
          if not languages:
              raise SystemExit('overlay/lang/*.json not found')

          base_name = 'ru' if 'ru' in languages else next(iter(languages))
          base_keys = set(languages[base_name])
          for name, data in languages.items():
              missing = sorted(base_keys - set(data))
              extra = sorted(set(data) - base_keys)
              if missing or extra:
                  raise SystemExit(f'{name}.json key mismatch: missing={missing}, extra={extra}')
          print(f'Validated {len(languages)} language files with {len(base_keys)} keys each.')
          PY

      - name: Сборка проекта
        run: make -j$(nproc)

      - name: Проверка целостности сборки
        run: |
          test -f RyazhaTune/RyazhaTune.nsp || { echo "Ошибка: RyazhaTune.nsp не найден" >&2; exit 1; }
          test -f overlay/RyazhaTune-overlay.ovl || { echo "Ошибка: RyazhaTune-overlay.ovl не найден" >&2; exit 1; }
          test -f overlay/lang/ru.json || { echo "Ошибка: ru.json не найден" >&2; exit 1; }
          test -f overlay/lang/en.json || { echo "Ошибка: en.json не найден" >&2; exit 1; }
          test -f overlay/lang/zh.json || { echo "Ошибка: zh.json не найден" >&2; exit 1; }

      - name: Подготовка архива RyazhTune.zip
        run: |
          rm -rf release RyazhaTune.zip
          mkdir -p release/atmosphere/contents/420000000000000E/flags
          touch release/atmosphere/contents/420000000000000E/flags/boot2.flag
          cp RyazhaTune/RyazhaTune.nsp release/atmosphere/contents/420000000000000E/exefs.nsp
          cp RyazhaTune/RyazhaTune.json release/atmosphere/contents/420000000000000E/
          cp RyazhaTune/toolbox.json release/atmosphere/contents/420000000000000E/

          mkdir -p release/switch/.overlays
          cp overlay/RyazhaTune-overlay.ovl release/switch/.overlays/

          mkdir -p release/config/RyazhaTune/lang
          cp overlay/lang/*.json release/config/RyazhaTune/lang/

          (cd release && zip -r ../RyazhaTune.zip atmosphere switch config)
          zip -sf RyazhaTune.zip | grep -q 'config/RyazhaTune/lang/ru.json'
          zip -sf RyazhaTune.zip | grep -q 'config/RyazhaTune/lang/en.json'
          zip -sf RyazhaTune.zip | grep -q 'config/RyazhaTune/lang/zh.json'

      - name: Генерация списка изменений (Changelog)
        id: changelog
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [[ -z "$LATEST_TAG" ]]; then
            LOG=$(git log --pretty=format:"* %s (%h)")
          else
            LOG=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"* %s (%h)")
          fi
          {
            echo "CHANGELOG<<EOF"
            echo "$LOG"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Создание тега и релиза
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.new_version }}
          name: RyazhTune v${{ needs.check-version.outputs.new_version }}
          files: |
            RyazhTune.zip
            overlay/RyazhTune-Overlay.ovl
          body: |
            ## Релиз RyazhaTune v${{ needs.check-version.outputs.new_version }}

            ### Перечень изменений:
            ${{ env.CHANGELOG }}

            ---
            *Сборка выполнена автоматически при обновлении версии в Makefile.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
