name: Автоматическая сборка и релиз RyazhTune

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ryazhatune-release-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check-version:
    name: Проверка версии
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.get_version.outputs.VERSION }}
      version_changed: ${{ steps.check_change.outputs.CHANGED }}
    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Настройка безопасного Git каталога
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Извлечение текущей версии из Makefile
        id: get_version
        run: |
          VERSION=$(awk -F ':=' '/^export VERSION/ { gsub(/[[:space:]]/, "", $2); print $2; exit }' Makefile)
          if [[ -z "$VERSION" ]]; then
            echo "Не удалось извлечь VERSION из Makefile" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Текущая версия в Makefile: $VERSION"

      - name: Проверка изменения версии
        id: check_change
        run: |
          CURRENT_VERSION='${{ steps.get_version.outputs.VERSION }}'
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          LATEST_VERSION=${LATEST_TAG#v}

          if [[ "$CURRENT_VERSION" != "$LATEST_VERSION" ]]; then
            echo "CHANGED=true" >> "$GITHUB_OUTPUT"
          else
            echo "CHANGED=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    name: Сборка и публикация
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Настройка безопасного Git каталога
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Проверка языковых файлов
        run: python3 scripts/validate_overlay_lang.py

      - name: Сборка проекта
        run: make -j$(nproc)

      - name: Проверка целостности сборки
        run: |
          test -f RyazhaTune/RyazhTune.nsp || { echo "Ошибка: RyazhTune.nsp не найден" >&2; exit 1; }
          test -f overlay/RyazhTune-Overlay.ovl || { echo "Ошибка: RyazhTune-Overlay.ovl не найден" >&2; exit 1; }
          test -f overlay/lang/ru.json || { echo "Ошибка: ru.json не найден" >&2; exit 1; }
          test -f overlay/lang/en.json || { echo "Ошибка: en.json не найден" >&2; exit 1; }
          test -f overlay/lang/zh.json || { echo "Ошибка: zh.json не найден" >&2; exit 1; }

      - name: Подготовка архива RyazhTune.zip
        run: |
          rm -rf release RyazhTune.zip
          mkdir -p release/atmosphere/contents/420000000000000E/flags
          touch release/atmosphere/contents/420000000000000E/flags/boot2.flag
          cp RyazhaTune/RyazhTune.nsp release/atmosphere/contents/420000000000000E/exefs.nsp
          cp RyazhaTune/RyazhTune.json release/atmosphere/contents/420000000000000E/
          cp RyazhaTune/toolbox.json release/atmosphere/contents/420000000000000E/

          mkdir -p release/switch/.overlays
          cp overlay/RyazhTune-Overlay.ovl release/switch/.overlays/

          mkdir -p release/config/RyazhaTune/lang
          cp overlay/lang/*.json release/config/RyazhaTune/lang/

          (cd release && zip -r ../RyazhTune.zip atmosphere switch config)
          zip -sf RyazhTune.zip | grep -q 'config/RyazhaTune/lang/ru.json'
          zip -sf RyazhTune.zip | grep -q 'config/RyazhaTune/lang/en.json'
          zip -sf RyazhTune.zip | grep -q 'config/RyazhaTune/lang/zh.json'

      - name: Формирование текста релиза через AI (OpenRouter, опционально)
        id: changelog
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_PROMPT: |
            Ты — технический редактор релизов. На входе список коммитов.
            Сделай человекочитаемое описание релиза на русском языке БЕЗ смайликов.
            Формат:
            1) Короткий абзац "В этом релизе..."
            2) "Основные изменения:" (пункты)
            3) "Исправления:" (пункты)
            4) "Важно для пользователей:" (2-4 пункта)
            Не выдумывай факты, опирайся только на коммиты.
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          RANGE="HEAD"
          [[ -n "$LATEST_TAG" ]] && RANGE="${LATEST_TAG}..HEAD"
          LOG=$(git log "$RANGE" --pretty=format:"- %s (%h)")

          if [[ -n "${OPENROUTER_API_KEY:-}" ]]; then
            PAYLOAD=$(jq -n \
              --arg model "meta-llama/llama-3.2-3b-instruct:free" \
              --arg prompt "$AI_PROMPT" \
              --arg log "$LOG" \
              '{
                model: $model,
                messages: [
                  {role: "system", content: "Пиши кратко, по-деловому и без смайликов."},
                  {role: "user", content: ($prompt + "\n\nКоммиты:\n" + $log)}
                ]
              }')

            AI_BODY=$(curl -sS https://openrouter.ai/api/v1/chat/completions \
              -H "Authorization: Bearer ${OPENROUTER_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" | jq -r '.choices[0].message.content // empty')
          fi

          if [[ -n "${AI_BODY:-}" ]]; then
            {
              echo "RELEASE_BODY<<EOF"
              echo "$AI_BODY"
              echo "EOF"
            } >> "$GITHUB_ENV"
          else
            FEATURES=$(printf "%s\n" "$LOG" | grep -Ei "add|feat|new|реализ|добав" || true)
            FIXES=$(printf "%s\n" "$LOG" | grep -Ei "fix|bug|исправ|устран" || true)
            OTHER=$(printf "%s\n" "$LOG" | grep -Eiv "add|feat|new|реализ|добав|fix|bug|исправ|устран" || true)

            {
              echo "RELEASE_BODY<<EOF"
              echo "В этом релизе реализованы изменения и исправлены обнаруженные проблемы."
              echo
              echo "Основные изменения:"
              if [[ -n "$FEATURES" ]]; then
                echo "$FEATURES"
              else
                echo "- Функциональные обновления проекта."
              fi
              echo
              echo "Исправления:"
              if [[ -n "$FIXES" ]]; then
                echo "$FIXES"
              else
                echo "- Исправления стабильности и поведения."
              fi
              if [[ -n "$OTHER" ]]; then
                echo
                echo "Прочие изменения:"
                echo "$OTHER"
              fi
              echo "EOF"
            } >> "$GITHUB_ENV"
          fi

      - name: Создание тега и релиза
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.new_version }}
          name: RyazhTune v${{ needs.check-version.outputs.new_version }}
          files: |
            RyazhTune.zip
            overlay/RyazhTune-Overlay.ovl
          body: |
            ## Релиз RyazhaTune v${{ needs.check-version.outputs.new_version }}
            ${{ env.RELEASE_BODY }}

            ---
            Сборка выполнена автоматически при обновлении версии в Makefile.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
