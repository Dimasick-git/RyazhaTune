name: "Автоматическая сборка и релиз RyazhTune"

on:
  push:
    branches:
      - main
    paths:
      - 'Makefile'
      - 'src/**'
      - 'include/**'
      - 'overlay/**'
      - '.github/workflows/build-and-release.yml'

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.CHANGED }}
      new_version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Настройка безопасного Git каталога
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Извлечение текущей версии из Makefile
        id: version
        run: |
          VERSION=$(grep "export VERSION" Makefile | sed 's/.*:= *//' | xargs)
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Проверка изменения версии
        id: check
        run: |
          CURRENT_VERSION='${{ steps.version.outputs.VERSION }}'
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          LATEST_VERSION=${LATEST_TAG#v}
          
          if [[ "$CURRENT_VERSION" != "$LATEST_VERSION" ]]; then
            echo "CHANGED=true" >> "$GITHUB_OUTPUT"
          else
            echo "CHANGED=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Установка зависимостей (jq)
        run: apt-get update && apt-get install -y jq curl git

      - name: Получение исходного кода
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Настройка безопасного Git каталога
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Проверка языковых файлов
        run: |
          if [ -d "overlay/lang" ]; then
            echo "Языковые файлы найдены."
          else
            echo "Ошибка: Директория overlay/lang не найдена!"
            exit 1
          fi

      - name: Подготовка библиотек
        run: make prepare-overlay-lib

      - name: Сборка проекта
        run: make clean && make -j$(nproc)

      - name: Проверка целостности сборки
        run: |
          if [ -f "RyazhTune/RyazhTune.nsp" ] && [ -f "overlay/RyazhTune-Overlay.ovl" ]; then
            echo "Сборка успешно завершена."
          else
            echo "Ошибка: Файлы сборки не найдены!"
            ls -R
            exit 1
          fi

      - name: Подготовка архива RyazhTune.zip
        run: |
          mkdir -p release/atmosphere/contents/420000000000000E/flags
          mkdir -p release/config/RyazhTune
          mkdir -p release/switch/.overlays
          
          # 1. Атмосфера (модуль)
          touch release/atmosphere/contents/420000000000000E/flags/boot2.flag
          cp RyazhTune/RyazhTune.nsp release/atmosphere/contents/420000000000000E/exefs.nsp
          cp RyazhTune/toolbox.json release/atmosphere/contents/420000000000000E/
          
          # 2. Конфиги и языки
          if [ -d "overlay/lang" ]; then
            cp -r overlay/lang release/config/RyazhTune/
          fi
          cp .github/default-config.ini release/config/RyazhTune/config.ini
          
          # 3. Оверлей
          cp overlay/RyazhTune-Overlay.ovl release/switch/.overlays/
          
          # Упаковка
          cd release && zip -r ../RyazhTune.zip . && cd ..

      - name: Формирование инженерного отчёта релиза
        id: changelog
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [[ -n "$LATEST_TAG" ]]; then
            RANGE="${LATEST_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi

          COMMITS=$(git log "$RANGE" --no-merges --pretty=format:"- %h %s")
          FILE_STATS=$(git diff --shortstat "$RANGE" || true)
          CHANGED_FILES=$(git diff --name-only "$RANGE" | sed 's/^/- /')

          [[ -z "$COMMITS" ]] && COMMITS="- Нет пользовательских коммитов в диапазоне релиза."
          [[ -z "$FILE_STATS" ]] && FILE_STATS="0 files changed, 0 insertions(+), 0 deletions(-)"
          [[ -z "$CHANGED_FILES" ]] && CHANGED_FILES="- Нет изменённых файлов."

          {
            echo "RELEASE_BODY<<EOF"
            echo "## Инженерный отчёт релиза"
            echo
            echo "### 1) Диапазон изменений"
            echo "- Тег-источник: ${LATEST_TAG:-<нет предыдущего тега>}"
            echo "- Диапазон: \`$RANGE\`"
            echo
            echo "### 2) Сводка diff"
            echo "- $FILE_STATS"
            echo
            echo "### 3) Коммиты в диапазоне"
            echo "$COMMITS"
            echo
            echo "### 4) Изменённые файлы"
            echo "$CHANGED_FILES"
            echo
            echo "### 5) Сборка и артефакты"
            echo "- Артефакты: \`RyazhTune.zip\`, \`RyazhTune-Overlay.ovl\`."
            echo "- В ZIP включён \`config/RyazhTune/config.ini\` и каталог \`config/RyazhTune/lang\` (при наличии)."
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Создание тега и релиза
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.new_version }}
          name: RyazhTune v${{ needs.check-version.outputs.new_version }}
          files: |
            RyazhTune.zip
            overlay/RyazhTune-Overlay.ovl
          body: |
            ${{ env.RELEASE_BODY }}

            ---
            _Сформировано автоматически в формате инженерного отчёта._
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
