name: "Автоматическая сборка и релиз RyazhTune"

on:
  push:
    branches:
      - main
    paths:
      - 'Makefile'
      - 'src/**'
      - 'include/**'
      - 'overlay/**'
      - '.github/workflows/build-and-release.yml'

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.CHANGED }}
      new_version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Настройка безопасного Git каталога
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Извлечение текущей версии из Makefile
        id: version
        run: |
          VERSION=$(grep "export VERSION" Makefile | sed 's/.*:= *//' | xargs)
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Проверка изменения версии
        id: check
        run: |
          CURRENT_VERSION='${{ steps.version.outputs.VERSION }}'
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          LATEST_VERSION=${LATEST_TAG#v}
          
          if [[ "$CURRENT_VERSION" != "$LATEST_VERSION" ]]; then
            echo "CHANGED=true" >> "$GITHUB_OUTPUT"
          else
            echo "CHANGED=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Установка зависимостей (jq)
        run: apt-get update && apt-get install -y jq curl git

      - name: Получение исходного кода
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Настройка безопасного Git каталога
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Проверка языковых файлов
        run: |
          if [ -d "overlay/lang" ]; then
            echo "Языковые файлы найдены."
          else
            echo "Ошибка: Директория overlay/lang не найдена!"
            exit 1
          fi

      - name: Подготовка библиотек
        run: make prepare-overlay-lib

      - name: Сборка проекта
        run: make clean && make -j$(nproc)

      - name: Проверка целостности сборки
        run: |
          if [ -f "RyazhTune/RyazhTune.nsp" ] && [ -f "overlay/RyazhTune-Overlay.ovl" ]; then
            echo "Сборка успешно завершена."
          else
            echo "Ошибка: Файлы сборки не найдены!"
            ls -R
            exit 1
          fi

      - name: Подготовка архива RyazhTune.zip
        run: |
          mkdir -p release/atmosphere/contents/420000000000000E/flags
          mkdir -p release/config/RyazhTune
          mkdir -p release/switch/.overlays
          
          # 1. Атмосфера (модуль)
          touch release/atmosphere/contents/420000000000000E/flags/boot2.flag
          cp RyazhTune/RyazhTune.nsp release/atmosphere/contents/420000000000000E/exefs.nsp
          cp RyazhTune/toolbox.json release/atmosphere/contents/420000000000000E/
          
          # 2. Конфиги и языки
          if [ -d "overlay/lang" ]; then
            cp -r overlay/lang release/config/RyazhTune/
          fi
          
          # 3. Оверлей
          cp overlay/RyazhTune-Overlay.ovl release/switch/.overlays/
          
          # Упаковка
          cd release && zip -r ../RyazhTune.zip . && cd ..

      - name: Формирование текста релиза через AI (OpenRouter)
        id: changelog
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [[ -n "$LATEST_TAG" ]]; then
            RANGE="${LATEST_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi
          
          # Собираем логи более детально (заголовки + тела коммитов для контекста)
          LOG=$(git log "$RANGE" --pretty=format:"- %s %b" | grep -Evi "merge branch|merge pull request|fix syntax|update workflow|fix yaml|refactor" | head -n 25)
          
          if [[ -n "${OPENROUTER_API_KEY}" && -n "$LOG" ]]; then
            PROMPT="Ты — автор крутого проекта RyazhaTune. Твоя задача: написать захватывающее и информативное описание нового релиза на РУССКОМ языке.
            
            Вот что изменилось в коде:
            $LOG
            
            Твои правила:
            1. Стиль: Эпичный, но человечный. Пиши от первого лица ('Я', 'Мой проект'). Используй живой язык, как будто рассказываешь друзьям о проделанной работе.
            2. Структура: 
               - Начни с яркого приветствия и общей фразы о том, что это важное обновление.
               - Сгруппируй изменения по смыслу (например: 'Визуальные правки', 'Внутренняя магия', 'Стабильность').
               - Опиши изменения ПОДРОБНО и ПОНЯТНО. Вместо 'исправил баг' напиши 'навел порядок в коде, чтобы всё работало как часы'.
               - Если добавлена новая фича — выдели её как главное событие.
            3. Оформление: Используй эмодзи для настроения, но не переборщи.
            4. Язык: Только РУССКИЙ. Никакого сухого перевода коммитов.
            5. Тон: Уверенный, дружелюбный, вдохновляющий.
            6. Концовка: Теплое пожелание пользователям.
            
            Важно: Не просто переводи список, а создай цельный, интересный текст, который приятно читать."
            
            PAYLOAD=$(jq -n \
              --arg model "google/gemma-4-31b-it:free" \
              --arg prompt "$PROMPT" \
              '{
                model: $model,
                messages: [
                  {role: "system", content: "Ты — разработчик RyazhaTune. Пишешь только на русском языке, кратко и по-человечески."},
                  {role: "user", content: $prompt}
                ]
              }')

            RESPONSE=$(curl -sS https://openrouter.ai/api/v1/chat/completions \
              -H "Authorization: Bearer ${OPENROUTER_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
            
            AI_BODY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')

            if [[ -z "$AI_BODY" || "$AI_BODY" == "null" ]]; then
              # Резервная модель
              PAYLOAD=$(echo "$PAYLOAD" | jq '.model = "meta-llama/llama-3.3-70b-instruct:free"')
              RESPONSE=$(curl -sS https://openrouter.ai/api/v1/chat/completions \
                -H "Authorization: Bearer ${OPENROUTER_API_KEY}" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD")
              AI_BODY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')
            fi
          fi

          if [[ -n "${AI_BODY}" && "${AI_BODY}" != "null" ]]; then
            {
              echo "RELEASE_BODY<<EOF"
              echo "$AI_BODY"
              echo "EOF"
            } >> "$GITHUB_ENV"
          else
            {
              echo "RELEASE_BODY<<EOF"
              echo "👋 Привет! Я выпустил новое обновление RyazhTune. В этой версии я внес внутренние улучшения и повысил стабильность работы. Приятного пользования! 🎧"
              echo "EOF"
            } >> "$GITHUB_ENV"
          fi

      - name: Создание тега и релиза
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.new_version }}
          name: RyazhTune v${{ needs.check-version.outputs.new_version }}
          files: |
            RyazhTune.zip
            overlay/RyazhTune-Overlay.ovl
          body: |
            ${{ env.RELEASE_BODY }}

            ---
            _Сгенерировано автоматически на основе истории изменений._
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
