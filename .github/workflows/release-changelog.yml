name: Release Changelog

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-changelog-${{ github.event.release.tag_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  update-release:
    runs-on: ubuntu-latest
    if: ${{ !github.event.release.draft }}
    steps:
      - name: Установка jq
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Настройка безопасного Git каталога
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Сформировать инженерный отчёт релиза
        id: changelog
        run: |
          CURRENT_TAG='${{ github.event.release.tag_name }}'
          PREV_TAG=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || echo "")
          RANGE="${CURRENT_TAG}"
          [[ -n "$PREV_TAG" ]] && RANGE="${PREV_TAG}..${CURRENT_TAG}"

          COMMITS=$(git log "$RANGE" --no-merges --pretty=format:"- %s" | head -n 25)
          FILE_STATS=$(git diff --shortstat "$RANGE" || true)
          CHANGED_FILES=$(git diff --name-only "$RANGE" | head -n 30 | sed 's/^/- /')

          [[ -z "$COMMITS" ]] && COMMITS="- Нет пользовательских коммитов в диапазоне релиза."
          [[ -z "$FILE_STATS" ]] && FILE_STATS="0 files changed, 0 insertions(+), 0 deletions(-)"
          [[ -z "$CHANGED_FILES" ]] && CHANGED_FILES="- Нет изменённых файлов."

          {
            echo "RELEASE_BODY<<EOF"
            echo "## Инженерный отчёт релиза"
            echo
            echo "### 1) Диапазон изменений"
            echo "- Текущий тег: $CURRENT_TAG"
            echo "- Предыдущий тег: ${PREV_TAG:-<не найден>}"
            echo "- Диапазон: \`$RANGE\`"
            echo
            echo "### 2) Сводка diff"
            echo "- $FILE_STATS"
            echo
            echo "### 3) Основные коммиты"
            echo "$COMMITS"
            echo
            echo "### 4) Изменённые файлы (первые 30)"
            echo "$CHANGED_FILES"
            echo
            echo "### 5) Артефакты релиза"
            echo "- Проверить наличие \`RyazhTune.zip\` и \`RyazhTune-Overlay.ovl\` в Assets."
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Обновить описание релиза
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          body: |
            ${{ env.RELEASE_BODY }}

            ---
            _Сформировано автоматически в формате инженерного отчёта._
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
