name: Release Changelog

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-changelog-${{ github.event.release.tag_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  update-release:
    runs-on: ubuntu-latest
    if: ${{ !github.event.release.draft }}
    steps:
      - name: Установка jq
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Настройка безопасного Git каталога
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Сформировать текст релиза через AI (OpenRouter)
        id: changelog
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          CURRENT_TAG='${{ github.event.release.tag_name }}'
          PREV_TAG=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || echo "")
          RANGE="${CURRENT_TAG}"
          [[ -n "$PREV_TAG" ]] && RANGE="${PREV_TAG}..${CURRENT_TAG}"
          
          # Фильтруем коммиты: убираем мержи и технический мусор
          LOG=$(git log "$RANGE" --pretty=format:"%s" | grep -Evi "merge branch|merge pull request|fix syntax|update workflow|fix yaml|refactor" | head -n 15)

          if [[ -n "${OPENROUTER_API_KEY}" && -n "$LOG" ]]; then
            PROMPT="Ты — разработчик проекта RyazhaTune. Напиши краткий и душевный пост об обновлении для пользователей на РУССКОМ языке.
            
            Список изменений:
            $LOG
            
            Инструкции:
            1. Пиши от ПЕРВОГО лица ('Я сделал', 'Я добавил', 'Исправил').
            2. НЕ перечисляй коммиты списком. Вместо этого проанализируй их и напиши 2-3 предложения о главных изменениях человеческим языком.
            3. Если изменений много, выдели только самое важное. Технические детали опускай.
            4. Обязательно используй русский язык.
            5. Тон: дружелюбный, неформальный. Можно использовать пару эмодзи.
            6. Формат: Приветствие, суть обновления (1-2 абзаца), пожелание."
            
            PAYLOAD=$(jq -n \
              --arg model "google/gemma-4-31b-it:free" \
              --arg prompt "$PROMPT" \
              '{
                model: $model,
                messages: [
                  {role: "system", content: "Ты — разработчик RyazhaTune. Пишешь только на русском языке, кратко и по-человечески."},
                  {role: "user", content: $prompt}
                ]
              }')

            RESPONSE=$(curl -sS https://openrouter.ai/api/v1/chat/completions \
              -H "Authorization: Bearer ${OPENROUTER_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
            
            AI_BODY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')

            if [[ -z "$AI_BODY" || "$AI_BODY" == "null" ]]; then
              PAYLOAD=$(echo "$PAYLOAD" | jq '.model = "meta-llama/llama-3.3-70b-instruct:free"')
              RESPONSE=$(curl -sS https://openrouter.ai/api/v1/chat/completions \
                -H "Authorization: Bearer ${OPENROUTER_API_KEY}" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD")
              AI_BODY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')
            fi
          fi

          if [[ -n "${AI_BODY}" && "${AI_BODY}" != "null" ]]; then
            {
              echo "RELEASE_BODY<<EOF"
              echo "$AI_BODY"
              echo "EOF"
            } >> "$GITHUB_ENV"
          else
            {
              echo "RELEASE_BODY<<EOF"
              echo "👋 Привет! Я выпустил новое обновление RyazhTune. В этой версии я внес внутренние улучшения и повысил стабильность работы. Приятного пользования! 🎧"
              echo "EOF"
            } >> "$GITHUB_ENV"
          fi

      - name: Обновить описание релиза
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          body: |
            ${{ env.RELEASE_BODY }}

            ---
            _Сгенерировано автоматически на основе истории изменений._
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
