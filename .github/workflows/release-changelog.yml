name: Release Changelog

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-changelog-${{ github.event.release.tag_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  update-release:
    runs-on: ubuntu-latest
    if: ${{ !github.event.release.draft }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Настройка безопасного Git каталога
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Сформировать текст релиза через AI (OpenRouter, опционально)
        id: changelog
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          CURRENT_TAG='${{ github.event.release.tag_name }}'
          PREV_TAG=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || echo "")
          RANGE="${CURRENT_TAG}"
          [[ -n "$PREV_TAG" ]] && RANGE="${PREV_TAG}..${CURRENT_TAG}"
          LOG=$(git log "$RANGE" --pretty=format:"- %s (%h)")

          if [[ -n "${OPENROUTER_API_KEY:-}" ]]; then
            PROMPT=$(cat <<'EOF'
Ты — технический редактор релизов. На входе список коммитов.
Сделай человекочитаемое описание релиза на русском языке БЕЗ смайликов.
Формат:
1) Короткий абзац "В этом релизе..."
2) "Основные изменения:" (пункты)
3) "Исправления:" (пункты)
4) "Важно для пользователей:" (2-4 пункта)
Не выдумывай факты, опирайся только на коммиты.
