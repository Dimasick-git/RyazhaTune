name: Release Changelog

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-changelog-${{ github.event.release.tag_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  update-release:
    runs-on: ubuntu-latest
    if: ${{ !github.event.release.draft }}
    steps:
      - name: Установка jq
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Настройка безопасного Git каталога
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Сформировать текст релиза через AI (OpenRouter)
        id: changelog
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          CURRENT_TAG='${{ github.event.release.tag_name }}'
          PREV_TAG=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || echo "")
          RANGE="${CURRENT_TAG}"
          [[ -n "$PREV_TAG" ]] && RANGE="${PREV_TAG}..${CURRENT_TAG}"
          LOG=$(git log "$RANGE" --pretty=format:"- %s (%h)")

          if [[ -n "${OPENROUTER_API_KEY}" ]]; then
            PROMPT="Ты — автор проекта RyazhaTune (мод для Nintendo Switch). Напиши пост о новом релизе для пользователей. 
            Пиши живым, дружелюбным языком, как человек, а не робот. 
            Используй умеренно подходящие эмодзи. 
            Структура:
            1. Приветствие и краткая суть обновления.
            2. Список того, что реально изменилось (основывайся на коммитах ниже).
            3. Если есть исправления — упомяни их.
            4. Пожелай приятного пользования.
            
            Важно: Не выдумывай функции, которых нет в коммитах. Если коммитов мало или они технические, просто опиши их доступно.
            
            Список коммитов:
            $LOG"
            
            PAYLOAD=$(jq -n \
              --arg model "google/gemma-4-31b-it:free" \
              --arg prompt "$PROMPT" \
              '{
                model: $model,
                messages: [
                  {role: "system", content: "Ты — разработчик homebrew для Nintendo Switch. Пишешь на русском языке, дружелюбно и понятно."},
                  {role: "user", content: $prompt}
                ]
              }')

            RESPONSE=$(curl -sS https://openrouter.ai/api/v1/chat/completions \
              -H "Authorization: Bearer ${OPENROUTER_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
            
            AI_BODY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')

            if [[ -z "$AI_BODY" || "$AI_BODY" == "null" ]]; then
              echo "Ошибка: AI вернул пустой ответ. Пробуем резервную модель..."
              PAYLOAD=$(echo "$PAYLOAD" | jq '.model = "meta-llama/llama-3.3-70b-instruct:free"')
              RESPONSE=$(curl -sS https://openrouter.ai/api/v1/chat/completions \
                -H "Authorization: Bearer ${OPENROUTER_API_KEY}" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD")
              AI_BODY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')
            fi
          fi

          if [[ -n "${AI_BODY}" && "${AI_BODY}" != "null" ]]; then
            {
              echo "RELEASE_BODY<<EOF"
              echo "$AI_BODY"
              echo "EOF"
            } >> "$GITHUB_ENV"
          else
            FEATURES=$(printf "%s\n" "$LOG" | grep -Ei "add|feat|new|реализ|добав" || true)
            FIXES=$(printf "%s\n" "$LOG" | grep -Ei "fix|bug|исправ|устран" || true)

            {
              echo "RELEASE_BODY<<EOF"
              echo "👋 Привет! Вышло новое обновление RyazhTune."
              echo
              echo "Что нового:"
              if [[ -n "$FEATURES" ]]; then
                echo "$FEATURES"
              else
                echo "- Внутренние улучшения и оптимизация кода."
              fi
              echo
              echo "Исправления:"
              if [[ -n "$FIXES" ]]; then
                echo "$FIXES"
              else
                echo "- Повышена стабильность работы модуля."
              fi
              echo
              echo "Спасибо, что пользуетесь RyazhTune! 🎧"
              echo "EOF"
            } >> "$GITHUB_ENV"
          fi

      - name: Обновить описание релиза
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          body: |
            ${{ env.RELEASE_BODY }}

            ---
            _Текст сформирован автоматически на основе истории коммитов._
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
